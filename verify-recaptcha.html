<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="referrer" content="no-referrer" />
    <script src="/static/js/logo-data.js"></script>
    <script>
      // Register App Cache Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("/sw.js").then(function(reg) {
            console.log("MARINA App Cache Service Worker registered:", reg.scope);
          }).catch(function(err) {
            console.log("Service Worker registration failed:", err);
          });
        });
      }

      // Robust DOM guard to ensure header logo never disappears when React mounts
      (function() {
        var logoSrc = "https://iili.io/Cs3uV0g.png";
        function fixLogos() {
          var imgs = document.querySelectorAll("header img, .header img, a[href="/"] img, a[href="index.html"] img, img[alt="Cs3uV0g.png"], img[alt="MARINA Logo"]");
          for (var i = 0; i < imgs.length; i++) {
            var img = imgs[i];
            if (!img.src || img.src === "" || img.src.indexOf("Cs3uV0g.png") === -1 && (!window.__MARINA_LOGO__ || img.src !== window.__MARINA_LOGO__)) {
              img.src = (window.__MARINA_LOGO__ || logoSrc);
              img.setAttribute("referrerpolicy", "no-referrer");
            }
            if (!img.onerror) {
              img.onerror = function() {
                if (window.__MARINA_LOGO__ && this.src !== window.__MARINA_LOGO__) {
                  this.src = window.__MARINA_LOGO__;
                }
              };
            }
          }
        }
        document.addEventListener("DOMContentLoaded", fixLogos);
        window.addEventListener("load", fixLogos);
        if (window.MutationObserver) {
          var obs = new MutationObserver(function() {
            fixLogos();
          });
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
        setInterval(fixLogos, 250);
      })();
    </script>

    <base href="/">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>reCAPTCHA Verification</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }
  .main-wrapper, #root, #root > div {
    min-height: 100vh;
  }
  .index-wrapper {
    background-color: #0f237a !important;
    background-image: url("https://iili.io/Cs3Y28g.jpg") !important;
    background-repeat: no-repeat !important;
    background-position: center center !important;
    background-size: cover !important;
    background-attachment: scroll !important;
    min-height: 100vh !important;
    width: 100% !important;
  }
</style>

</head>
<body>
  <p>This endpoint is used by the site to verify the reCAPTCHA response.</p>
</body>
</html>
