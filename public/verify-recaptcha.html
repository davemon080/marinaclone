    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("/sw.js").then(function(reg) {
            console.log("App Cache active:", reg.scope);
          }).catch(function(err) {
            console.warn("Service worker notice:", err);
          });
        });
      }

      // Continuous DOM guard ensuring logo is present on all React lifecycle events
      (function() {
        var LOGO_URL = "https://iili.io/Cs3uV0g.png";
        function ensureLogo() {
          var logoElements = document.querySelectorAll("header img, .header img, a[href="/"] img, a[href="index.html"] img, img[alt="MARINA Logo"], img[alt="Cs3uV0g.png"]");
          for (var i = 0; i < logoElements.length; i++) {
            var img = logoElements[i];
            if (!img.src || img.src === "" || img.src.indexOf("Cs3uV0g.png") === -1) {
              img.src = LOGO_URL;
              img.setAttribute("referrerpolicy", "no-referrer");
            }
          }
        }
        document.addEventListener("DOMContentLoaded", ensureLogo);
        window.addEventListener("load", ensureLogo);
        if (window.MutationObserver) {
          new MutationObserver(ensureLogo).observe(document.documentElement, { childList: true, subtree: true });
        }
        setInterval(ensureLogo, 300);
      })();
    </script>

    


    
    <script>
      // Register App Cache Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("/sw.js").then(function(reg) {
            console.log("MARINA App Cache Service Worker registered:", reg.scope);
          }).catch(function(err) {
            console.log("Service Worker registration failed:", err);
          });
        });
      }

      // Robust DOM guard to ensure header logo never disappears when React mounts
      (function() {
        var logoSrc = "https://iili.io/Cs3uV0g.png";
        function fixLogos() {
          var imgs = document.querySelectorAll("header img, .header img, a[href="/"] img, a[href="index.html"] img, img[alt="Cs3uV0g.png"], img[alt="MARINA Logo"]");
          for (var i = 0; i < imgs.length; i++) {
            var img = imgs[i];
            if (!img.src || img.src === "" || img.src.indexOf("Cs3uV0g.png") === -1 && (!window.__MARINA_LOGO__ || img.src !== window.__MARINA_LOGO__)) {
              img.src = (window.__MARINA_LOGO__ || logoSrc);
              img.setAttribute("referrerpolicy", "no-referrer");
            }
            if (!img.onerror) {
              img.onerror = function() {
                if (window.__MARINA_LOGO__ && this.src !== window.__MARINA_LOGO__) {
                  this.src = window.__MARINA_LOGO__;
                }
              };
            }
          }
        }
        document.addEventListener("DOMContentLoaded", fixLogos);
        window.addEventListener("load", fixLogos);
        if (window.MutationObserver) {
          var obs = new MutationObserver(function() {
            fixLogos();
          });
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
        setInterval(fixLogos, 250);
      })();
    </script>
